[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Pretty URLs — serve /articles/slug/ as /articles/slug/index.html automatically.
# The [[redirects]] block that previously attempted the same thing has been removed:
# it matched "/*" and rewrote /main.css → /main.css/index.html, conflicting with
# static asset delivery. Netlify's built-in directory index + pretty_urls handles
# clean URLs correctly without a wildcard redirect.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Redirects: the Missing Scientists dossier moved from the site root to its own
# namespace (/missing-scientists/) in the multi-dossier rebrand. Forward old
# root-served section URLs so external links / bookmarks don't 404. The root "/"
# now serves the dossier directory; /methodology/ and /transparency/ stay at root.
[[redirects]]
  from = "/cases/*"
  to = "/missing-scientists/cases/:splat"
  status = 301

[[redirects]]
  from = "/analysis/*"
  to = "/missing-scientists/analysis/:splat"
  status = 301

[[redirects]]
  from = "/diagram/*"
  to = "/missing-scientists/diagram/:splat"
  status = 301

[[redirects]]
  from = "/timeline/*"
  to = "/missing-scientists/timeline/:splat"
  status = 301

[[redirects]]
  from = "/sources/*"
  to = "/missing-scientists/sources/:splat"
  status = 301

# Cache: crawl/index files — short TTL so re-deploys propagate quickly
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Cache: fonts and images — 1 year immutable
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache: CSS and JS — must revalidate.
#
# These previously claimed "content-hashed by esbuild — 1 year immutable". They
# are not hashed: the build emits fixed /main.css and /main.js (build.ts pins
# `outfile`, and no `entryNames` hash is configured). A stable URL marked
# immutable for a year means a returning visitor never re-fetches, so every CSS
# and JS change stays invisible to them until the year elapses. That is exactly
# what happened: a layout fix went live and returning browsers kept the old file.
#
# max-age=0 + must-revalidate makes the browser issue a conditional request; the
# ETag still yields a cheap 304 when nothing changed, so this costs one small
# round-trip per asset, not a re-download.
#
# The better fix is real content hashing (hash in the filename, template emits
# the hashed href) — then these can honestly go back to immutable AND updates
# land instantly. Until that exists, these headers must stay revalidating.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers — applied to all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
