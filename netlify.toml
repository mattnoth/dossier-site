[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Pretty URLs — serve /articles/slug/ as /articles/slug/index.html automatically.
# The [[redirects]] block that previously attempted the same thing has been removed:
# it matched "/*" and rewrote /main.css → /main.css/index.html, conflicting with
# static asset delivery. Netlify's built-in directory index + pretty_urls handles
# clean URLs correctly without a wildcard redirect.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Redirects: the Missing Scientists dossier moved from the site root to its own
# namespace (/missing-scientists/) in the multi-dossier rebrand. Forward old
# root-served section URLs so external links / bookmarks don't 404. The root "/"
# now serves the dossier directory; /methodology/ and /transparency/ stay at root.
[[redirects]]
  from = "/cases/*"
  to = "/missing-scientists/cases/:splat"
  status = 301

[[redirects]]
  from = "/analysis/*"
  to = "/missing-scientists/analysis/:splat"
  status = 301

[[redirects]]
  from = "/diagram/*"
  to = "/missing-scientists/diagram/:splat"
  status = 301

[[redirects]]
  from = "/timeline/*"
  to = "/missing-scientists/timeline/:splat"
  status = 301

[[redirects]]
  from = "/sources/*"
  to = "/missing-scientists/sources/:splat"
  status = 301

# Cache: crawl/index files — short TTL so re-deploys propagate quickly
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Cache: fonts and images — 1 year immutable
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache: CSS and JS — 1 year immutable, and now actually content-hashed.
#
# build.ts hashes each asset's bytes into its filename (main.<hash>.css) and the
# base template emits that href, so changed content always means a changed URL.
# Immutable is therefore safe: a stale copy is never requested again, because
# nothing links to its URL any more.
#
# This only holds while the filenames carry the hash. An earlier version of this
# file claimed the assets were hashed when they were not — the result was that
# every CSS/JS change stayed invisible to returning visitors for up to a year.
# If hashing is ever removed from build.ts, these two blocks must drop back to
# "public, max-age=0, must-revalidate" in the same commit.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers — applied to all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
